# very_good_analysis with zero issues is enforced in CI (--fatal-infos).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "lib/gen/**"
    - "build/**"

linter:
  rules:
    # Same as VGV's app template: public classes and every repository method
    # are documented by convention (PR review), not by a lint that also
    # demands a doc on every constructor and field.
    public_member_api_docs: false
    # Data sources and repositories are interfaces even when they have one
    # method (the guide's contract-per-boundary pattern), so this lint
    # would flag the architecture itself.
    one_member_abstracts: false
