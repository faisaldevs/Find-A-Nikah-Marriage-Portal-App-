name: find_a_nikah
description: "Find A Nikah — Muslim marriage app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Architecture baseline
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  dio: ^5.11.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  retrofit: ^4.10.0

  # Feature dependencies
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  flutter_screenutil_plus: ^1.6.0
  geolocator: ^14.0.3
  google_mlkit_face_detection: ^0.15.1
  image_picker: ^1.2.0
  # Direct deps only to switch Android to the system Photo Picker (di.dart).
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1
  intl_phone_field: ^3.2.0
  latlong2: ^0.10.1
  package_info_plus: ^10.2.1
  toastification: ^3.2.0
  camera: ^0.12.1
  permission_handler: ^13.0.2
  flutter_image_compress: ^2.5.1
  flutter_svg: ^2.3.0
  share_plus: ^13.3.1
  geocoding: ^5.0.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.9
  very_good_analysis: ^10.3.0

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    image: false
    flutter_svg: false
  assets:
    outputs:
      class_name: Assets
  colors:
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi/Satoshi-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi/Satoshi-Black.ttf
          weight: 900
