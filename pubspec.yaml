name: find_a_nikah
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.4.2
  socket_io_client: ^3.1.6
  go_router: ^17.5.0
  carousel_slider: ^5.1.2
  flutter_screenutil_plus: ^1.6.0
  image_picker: ^1.2.0
  intl_phone_field: ^3.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  google_mlkit_face_detection: ^0.15.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  google_fonts: ^8.2.1

dev_dependencies:

  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  freezed: ^3.2.0
  json_serializable: ^6.14.1


flutter_gen:
  output: lib/gen/  # Where generated files go
  line_length: 80

  # Optional: Enable integrations for SVG, Lottie, etc.
  integrations:
    image: false
    flutter_svg: false
    # lottie: false
    # rive: false

  assets:
    outputs:
      class_name: Assets
      
  colors:
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi/Satoshi-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi/Satoshi-Black.ttf
          weight: 900
